# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz  <- 与 Moteus 实际 CAN 循环对齐（实测~116Hz，统一到100Hz避免丢帧）

    dummyx2_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

dummyx2_arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    # 对齐到100Hz统一控制频率
    state_publish_rate: 100.0  # Hz  (与 controller_manager.update_rate 一致)